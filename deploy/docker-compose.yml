# 換組意向匹配系統 — 自架部署
#
# 四個服務，刻意不用 Kong：nginx 同時負責靜態檔與 API 反向代理，
# 在 2 核 1.9G 的機器上省下約 200MB。
#
#   web  :80   nginx  → 靜態前端 + /rest/v1 /auth/v1 反代
#   rest       PostgREST
#   auth       GoTrue（管理頁登入用）
#   db         supabase/postgres（內含 pg_cron、pgcrypto、anon/authenticated 角色、auth schema）
#
# 映像一律走 public.ecr.aws：大陸機房連 Docker Hub 不通，ECR 可達。

name: switch-class

services:
  db:
    image: public.ecr.aws/supabase/postgres:17.6.1.165
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - shared_preload_libraries=pg_stat_statements,pg_cron
      - -c
      - cron.database_name=postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
    # 只在 compose 內網暴露，不對外開 5432
    expose: ["5432"]

  rest:
    image: public.ecr.aws/supabase/postgrest:v16.1
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_LOG_LEVEL: info
    expose: ["3000"]

  auth:
    image: public.ecr.aws/supabase/gotrue:v2.196.0
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: 9999
      API_EXTERNAL_URL: ${PUBLIC_URL}/auth/v1
      GOTRUE_SITE_URL: ${PUBLIC_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres?search_path=auth
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      # 管理員帳號由 scripts/setup-admin.sh 用 service key 建立，不開放自助註冊
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_LOG_LEVEL: info
    expose: ["9999"]

  web:
    build:
      context: ./app
      dockerfile: ../Dockerfile
      args:
        VITE_SUPABASE_URL: ${PUBLIC_URL}
        VITE_SUPABASE_KEY: ${ANON_KEY}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: switch-class-web:latest
    restart: unless-stopped
    depends_on: [rest, auth]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTP_PORT_ALT:-8000}:8000"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db-data:
