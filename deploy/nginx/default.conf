server {
  listen 80;
  listen 8000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 2m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Docker 內建 DNS。proxy_pass 寫成字面主機名時，nginx 只在啟動時解析一次並永久
  # 快取；rest / auth 容器一被重建（apply-migrations.sh 會 --force-recreate）IP 就變，
  # 站點會一路 502 到手動重啟 nginx 為止。改用變數 + resolver，讓它每次請求重新解析。
  resolver 127.0.0.11 valid=10s ipv6=off;

  # supabase-js 會打 ${url}/rest/v1/... 與 ${url}/auth/v1/...
  # proxy_pass 帶變數時不會自動剝前綴，所以用正則捕捉後手動接上
  location ~ ^/rest/v1/(.*)$ {
    set $rest_host rest;
    proxy_pass http://$rest_host:3000/$1$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/auth/v1/(.*)$ {
    set $auth_host auth;
    proxy_pass http://$auth_host:9999/$1$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # PWA 的 service worker 不該被快取，否則使用者會卡在舊版
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location ~* \.(js|css|woff2?|png|svg)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
