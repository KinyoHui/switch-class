server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 2m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # supabase-js 會打 ${url}/rest/v1/... 與 ${url}/auth/v1/...
  # proxy_pass 結尾帶 / 會把前綴剝掉，PostgREST 與 GoTrue 收到的才是它們認得的路徑
  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # PWA 的 service worker 不該被快取，否則使用者會卡在舊版
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location ~* \.(js|css|woff2?|png|svg)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
